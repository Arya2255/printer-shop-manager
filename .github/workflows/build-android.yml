name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-tools android-sdk-build-tools
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install Flet
        run: pip install flet flet-desktop

      - name: Build APK
        run: flet build apk --yes --project printer-shop-manager --org ir.local --product "مدیر تعمیرگاه پرینتر" --bundle-id ir.local.printershop --android-permissions android.permission.INTERNET=true android.permission.READ_MEDIA_IMAGES=true android.permission.READ_MEDIA_VIDEO=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: printer-shop-manager-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
