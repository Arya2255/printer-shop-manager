[project]
name = "printer-shop-manager"
version = "0.1.0"
description = "Persian printer repair, inventory and sales manager"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.143,<1",
  "flet==1.0.4",
  "flet-desktop==1.0.4",
  "flet-web==1.0.4",
  "httpx>=0.28,<1",
  "jdatetime>=5.2,<6",
]

[dependency-groups]
dev = [
  "flet-cli==1.0.4",
  "pytest>=9,<10",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.flet]
org = "ir.local"
product = "مدیر تعمیرگاه پرینتر"
company = "Printer Shop"
copyright = "2026"

[tool.flet.app]
path = "src"

[tool.flet.android]
gradle_properties = { "org.gradle.jvmargs" = "-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m" }

[tool.flet.android.manifest_application]
usesCleartextTraffic = true
allowBackup = true

[tool.flet.flutter.pubspec.dependency_overrides]
vector_math = "2.2.0"
collection = "1.19.0"

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]
